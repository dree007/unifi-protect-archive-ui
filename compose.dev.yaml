# Local development only – not a production setup (that is compose.yaml, docs/selfhosting.md).
# Always pass this file explicitly, e.g.:
#   docker compose -f compose.dev.yaml up -d postgres
# Values can be overridden via environment variables or a `.env` file next to this file
# (Docker Compose does not read `.env.local`).

# Fixed project name: keeps the existing development containers and the volume
# `unifi-archive-ui_postgres-data`, and never mixes with the production project `unifi-archive`.
name: unifi-archive-ui

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unifi_archive}
      POSTGRES_USER: ${POSTGRES_USER:-unifi_archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unifi_archive}
    ports:
      # Bound to localhost only, so the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data below /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # Node.js 24 + ffmpeg for npm scripts and `next dev`, without installing them on the host.
  # Only started explicitly (profile `dev`), e.g.:
  #   docker compose -f compose.dev.yaml run --rm dev npm run archive:scan
  #   docker compose -f compose.dev.yaml up -d dev collector   # next dev on http://<host>:${DEV_PORT:-3005} + collector
  dev: &dev
    profiles: [dev]
    image: unifi-archive-ui-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Host network: `localhost:5432` in DATABASE_URL and the Protect console work unchanged.
    network_mode: host
    # Host user, so node_modules, .next and the thumbnail cache stay owned by you.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      HOME: /tmp
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # Wins over ARCHIVE_ROOT in .env.local (variables already set take precedence).
      ARCHIVE_ROOT: /archive
    volumes:
      - .:/app
      # Archive from the host, read-only. Set ARCHIVE_HOST_PATH in `.env` next to this file;
      # without it the service refuses to start (the path is never created).
      - type: bind
        source: ${ARCHIVE_HOST_PATH:-/ARCHIVE_HOST_PATH-not-set}
        target: /archive
        read_only: true
        bind:
          create_host_path: false
    working_dir: /app
    command: ["npm", "run", "dev", "--", "-p", "${DEV_PORT:-3005}"]
    depends_on:
      postgres:
        condition: service_healthy

  # Protect event collector (long-running, same toolbox image). Logs: docker compose -f compose.dev.yaml logs -f collector
  collector:
    <<: *dev
    command: ["npm", "run", "protect:collect", "--", "--verbose"]
    restart: unless-stopped

  # Browser for the end-to-end tests (Playwright, same version as @playwright/test). The tests
  # run in `dev` (Node + ffmpeg) and drive this browser remotely; see docs/testing.md.
  #   docker compose -f compose.dev.yaml --profile e2e up -d playwright
  #   docker compose -f compose.dev.yaml run --rm -e PW_TEST_CONNECT_WS_ENDPOINT=ws://127.0.0.1:3333/ dev npm run test:e2e
  playwright:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    network_mode: host
    init: true
    user: pwuser
    working_dir: /home/pwuser
    command: ["npx", "-y", "playwright@1.63.0", "run-server", "--port", "3333", "--host", "127.0.0.1"]

volumes:
  postgres-data:
