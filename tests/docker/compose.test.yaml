# Override for the Docker integration test (tests/docker/run.mts) – never for a real installation.
# Adds a fake UniFi Protect console on the bridge network and makes health checks fast. Every
# value comes from the test's generated env file; the runner uses its own project name, so
# containers, networks and volumes are separate from any real installation.
services:
  fake-protect:
    image: ${UNIFI_ARCHIVE_IMAGE:?}
    command: ["node", "/fake/fake-protect-server.mjs"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - type: bind
        source: ${FAKE_PROTECT_DIR:?}
        target: /fake
        read_only: true
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:${FAKE_PROTECT_CONTROL_PORT:?}:8080"
    networks: [default]

  web:
    healthcheck:
      interval: 2s
      start_period: 60s

  worker:
    healthcheck:
      interval: 2s
      start_period: 60s
