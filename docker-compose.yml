# Unifi Protect Archive UI: one image, four roles, one web port.
# Set POSTGRES_PASSWORD and NAS_ARCHIVE_HOST_PATH in .env, then:
# docker compose up -d -> http://<docker-host-ip>:3100
# LAN mode has no login or HTTPS. See SECURITY.md before exposing the port.
name: unifi-archive

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unifi_archive}
      POSTGRES_USER: ${POSTGRES_USER:-unifi_archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  migrate:
    image: ${UNIFI_ARCHIVE_IMAGE:-ghcr.io/dree007/unifi-protect-archive-ui:1.1.0}
    command: ["node", "cli/migrate.mjs"]
    restart: "no"
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Driver reads the password separately; special characters need no URL encoding.
      DATABASE_URL: postgresql://postgres:5432
      PGUSER: ${POSTGRES_USER:-unifi_archive}
      PGDATABASE: ${POSTGRES_DB:-unifi_archive}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]

  web:
    image: ${UNIFI_ARCHIVE_IMAGE:-ghcr.io/dree007/unifi-protect-archive-ui:1.1.0}
    restart: unless-stopped
    user: "1000:1000"
    group_add: ["${NAS_ARCHIVE_GID:-1000}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql://postgres:5432
      PGUSER: ${POSTGRES_USER:-unifi_archive}
      PGDATABASE: ${POSTGRES_DB:-unifi_archive}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Berlin}
      APP_SOURCE_URL: ${APP_SOURCE_URL:-}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-}
      ARCHIVE_ROOT: /archive
      THUMBNAIL_CACHE_ROOT: /data/thumbnails
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      THUMBNAIL_MAX_CONCURRENCY: ${THUMBNAIL_MAX_CONCURRENCY:-}
    volumes:
      - type: bind
        source: ${NAS_ARCHIVE_HOST_PATH:?Set NAS_ARCHIVE_HOST_PATH in .env (see .env.example)}
        target: /archive
        read_only: true
        bind: {create_host_path: false, propagation: "${NAS_ARCHIVE_PROPAGATION:-rprivate}"}
      - thumbnails:/data/thumbnails
    ports:
      - "${UNIFI_ARCHIVE_BIND_IP:-0.0.0.0}:${UNIFI_ARCHIVE_PORT:-3100}:3000"
    # Uses the image's CMD ["node", "server.js"].
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [internal, default]

  worker:
    image: ${UNIFI_ARCHIVE_IMAGE:-ghcr.io/dree007/unifi-protect-archive-ui:1.1.0}
    command: ["node", "--enable-source-maps", "cli/worker-run.mjs"]
    restart: unless-stopped
    user: "1000:1000"
    group_add: ["${NAS_ARCHIVE_GID:-1000}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql://postgres:5432
      PGUSER: ${POSTGRES_USER:-unifi_archive}
      PGDATABASE: ${POSTGRES_DB:-unifi_archive}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Berlin}
      ARCHIVE_ROOT: /archive
      ARCHIVE_REQUIRED_FS_TYPE: ${ARCHIVE_REQUIRED_FS_TYPE:-}
      ARCHIVE_SCAN_INTERVAL_MINUTES: ${ARCHIVE_SCAN_INTERVAL_MINUTES:-}
      ARCHIVE_RECONCILE_INTERVAL_MINUTES: ${ARCHIVE_RECONCILE_INTERVAL_MINUTES:-}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-}
      WORKER_RUN_ON_STARTUP: ${WORKER_RUN_ON_STARTUP:-}
      PROTECT_COLLECTOR_ENABLED: ${PROTECT_COLLECTOR_ENABLED:-auto}
      UNIFI_PROTECT_URL: ${UNIFI_PROTECT_URL:-}
      UNIFI_PROTECT_API_KEY: ${UNIFI_PROTECT_API_KEY:-}
      UNIFI_PROTECT_TLS_VERIFY: ${UNIFI_PROTECT_TLS_VERIFY:-true}
    volumes:
      - type: bind
        source: ${NAS_ARCHIVE_HOST_PATH:?Set NAS_ARCHIVE_HOST_PATH in .env (see .env.example)}
        target: /archive
        read_only: true
        bind: {create_host_path: false, propagation: "${NAS_ARCHIVE_PROPAGATION:-rprivate}"}
    healthcheck:
      test: ["CMD", "node", "cli/worker-health.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [internal, default]

networks:
  internal: {internal: true}
  default: {}

# Existing names are retained so updates reuse database and thumbnail data.
volumes:
  postgres-data:
  thumbnails:
